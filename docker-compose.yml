# written by sounic behera
services:
  # 1. TimescaleDB (Time-Series PostgreSQL)
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: vayu_timescale
    environment:
      POSTGRES_USER: vayu_admin
      POSTGRES_PASSWORD: vayu_secure_password
      POSTGRES_DB: vayu_cpi
    ports:
      - "5433:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./sql/01_init_timescale.sql:/docker-entrypoint-initdb.d/01_init.sql
    restart: unless-stopped

  # 2. Redis (Streaming Buffer)
  redis:
    image: redis:7-alpine
    container_name: vayu_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  # 3. MinIO (S3-Compatible Object Store)
  minio:
    image: minio/minio:latest
    container_name: vayu_minio
    environment:
      MINIO_ROOT_USER: vayu_admin_key
      MINIO_ROOT_PASSWORD: vayu_secret_pass
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  # 4. Celery Worker (Distributed Scraper)
  celery_worker:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: vayu_celery
    command: celery -A scraper.worker worker --concurrency=4 --loglevel=info
    environment:
      - REDIS_URL=redis://vayu_redis:6379/0
      - DB_URL=postgresql://vayu_admin:vayu_secure_password@vayu_timescale:5432/vayu_cpi
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=vayu_admin_key
      - MINIO_SECRET_KEY=vayu_secret_pass
      - AWS_ACCESS_KEY_ID=vayu_admin_key
      - AWS_SECRET_ACCESS_KEY=vayu_secret_pass
      - AWS_ENDPOINT_URL_S3=http://minio:9000
      - PYTHONPATH=/app
    depends_on:
      - redis
      - timescaledb
      - minio

  # 5. FastAPI Backend
  api:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: vayu_api
    command: uvicorn api.app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - DB_URL=postgresql://vayu_admin:vayu_secure_password@vayu_timescale:5432/vayu_cpi
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=vayu_admin_key
      - MINIO_SECRET_KEY=vayu_secret_pass
      - PYTHONPATH=/app
    depends_on:
      - timescaledb
      - minio

  # 6. Next.js Dashboard
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vayu_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api

volumes:
  timescaledb_data:
  
  redis_data:
  minio_data: