# written by sounic behera
services:
  # 1. TimescaleDB (Time-Series PostgreSQL)
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: vayu_timescale
    env_file: .env
    ports:
      - "5433:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./sql/01_init_timescale.sql:/docker-entrypoint-initdb.d/01_init.sql
    restart: unless-stopped
    networks:
      - vayu_net

  # 2. Redis (Streaming Buffer)
  redis:
    image: redis:7-alpine
    container_name: vayu_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - vayu_net

  # 3. MinIO (S3-Compatible Object Store)
  minio:
    image: minio/minio:latest
    container_name: vayu_minio
    env_file: .env
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      - vayu_net

  # 4. Celery Worker (Distributed Scraper)
  celery_worker:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: vayu_celery
    command: celery -A scraper.worker worker --concurrency=4 --loglevel=info
    env_file: .env
    environment:
      - PYTHONPATH=/app
    depends_on:
      - redis
      - timescaledb
      - minio
    networks:
      - vayu_net

  # 5. FastAPI Backend
  api:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: vayu_api
    command: uvicorn api.app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - PYTHONPATH=/app
    depends_on:
      - timescaledb
      - minio
    networks:
      - vayu_net

  # 6. Next.js Dashboard
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vayu_frontend
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      - api
    networks:
      - vayu_net

networks:
  vayu_net:
    driver: bridge

volumes:
  timescaledb_data:
  redis_data:
  minio_data: